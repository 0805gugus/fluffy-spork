<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Яркий Блог</title>
    <style>
        :root { --yellow: #fff000; --pink: #ff00ff; --cyan: #00ffff; --black: #000000; }
        body { background-color: #121212; font-family: 'Arial Black', sans-serif; margin: 0; padding: 20px; color: white; display: flex; flex-direction: column; align-items: center; }
        
        /* Счетчик в шапке */
        .stats { font-size: 1rem; background: var(--black); color: var(--cyan); padding: 5px 15px; border: 2px solid var(--cyan); display: inline-block; margin-top: 10px; }

        header { background: var(--pink); color: var(--black); padding: 40px; border: 6px solid white; box-shadow: 15px 15px 0px var(--cyan); text-align: center; width: 90%; max-width: 800px; margin-bottom: 50px; transform: rotate(-1deg); }

        .blog-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; width: 100%; max-width: 1100px; }

        .card { background: white; color: var(--black); border: 5px solid var(--black); padding: 20px; box-shadow: 10px 10px 0px var(--yellow); transition: 0.3s; cursor: pointer; position: relative; }
        .card:hover { transform: translateY(-10px); box-shadow: 15px 20px 0px var(--pink); }

        .like-btn { position: absolute; bottom: 10px; right: 10px; background: none; border: none; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .like-btn:hover { transform: scale(1.3); }

        .btn { background: var(--black); color: white; padding: 10px 20px; border: none; text-transform: uppercase; cursor: pointer; box-shadow: 4px 4px 0px var(--pink); }

        /* Модальное окно */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; color: black; border: 8px solid var(--black); padding: 30px; width: 100%; max-width: 700px; box-shadow: 20px 20px 0px var(--cyan); position: relative; max-height: 80vh; overflow-y: auto; }
        .close-modal { position: sticky; top: 0; float: right; background: var(--pink); border: 3px solid black; font-weight: bold; cursor: pointer; padding: 10px; margin-bottom: 10px; }

        .comments { margin-top: 60px; width: 90%; max-width: 800px; background: var(--yellow); color: var(--black); padding: 20px; border: 5px solid white; box-shadow: 10px 10px 0px var(--cyan); }
        textarea { width: 100%; height: 80px; border: 3px solid var(--black); padding: 10px; margin: 10px 0; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <h1>⚡️ БЛОГ ПРОГРАММИСТА ⚡️</h1>
        <div class="stats">ПРОСМОТРОВ: <span id="viewCount">0</span></div>
    </header>

    <div class="blog-container">
        
        <div class="card" onclick="openModal('КАК Я СТАЛ ПРОФИ', 'Здесь твоя история. Напиши, как ты создал свой первый сайт на Netlify. Это было круто! Помни, что здесь можно писать очень длинные тексты, они будут прокручиваться.')">
            <span style="background:var(--pink); color:white; padding:5px;">#MY_STORY</span>
            <h2>Как я стал профи</h2>
            <p>Нажми, чтобы прочитать мою историю успеха...</p>
            <button class="btn">Читать</button>
            <button class="like-btn" onclick="event.stopPropagation(); this.innerHTML='❤️'">🤍</button>
        </div>

        <div class="card" onclick="openModal('ПЛАНЫ НА 2026', 'В этом году я планирую выучить JavaScript на уровне мастера и запустить еще 10 крутых проектов!')">
            <span style="background:var(--cyan); color:black; padding:5px;">#PLANS</span>
            <h2>Планы на 2026 год</h2>
            <p>Рассказываю, что я задумал сделать в этом году...</p>
            <button class="btn">Читать</button>
            <button class="like-btn" onclick="event.stopPropagation(); this.innerHTML='❤️'">🤍</button>
        </div>

    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">ЗАКРЫТЬ [X]</button>
            <h2 id="modalTitle" style="text-transform: uppercase; font-size: 2rem; border-bottom: 5px solid var(--yellow);"></h2>
            <p id="modalText" style="font-family: sans-serif; line-height: 1.6; font-size: 1.1rem; margin-top: 20px;"></p>
        </div>
    </div>

    <div class="comments">
        <h3>ОБРАТНАЯ СВЯЗЬ:</h3>
        <form action="https://formspree.io/f/xzddpere" method="POST">
            <input type="email" name="email" placeholder="Твой Email" required style="width:100%; padding:10px; border:3px solid black; box-sizing: border-box;">
            <textarea name="message" placeholder="Напиши мне что угодно..." required></textarea>
            <button type="submit" class="btn">ОТПРАВИТЬ</button>
        </form>
    </div>

    <script>
        // Счетчик просмотров (имитация)
        let count = 0;
        const target = Math.floor(Math.random() * 500) + 100;
        const timer = setInterval(() => {
            count += 5;
            document.getElementById('viewCount').innerText = count;
            if(count >= target) clearInterval(timer);
        }, 30);

        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Запретить скролл страницы
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.body.style.overflow = 'auto'; // Вернуть скролл
        }
    </script>
       <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</body>
</html>
